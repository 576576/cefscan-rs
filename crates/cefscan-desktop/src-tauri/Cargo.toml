[package]
name = "cefscanw"
description = "GUI front-end for cefscan (Tauri 2)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "cefscanw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cefscan-core = { workspace = true }
tauri = { version = "2", features = [] }
serde = { workspace = true }

[dev-dependencies]
# 只用来给 ScanEvent 的线上格式（前端依赖的契约）写断言。
serde_json = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# 图标只在 Windows 上提取（icon.rs），所以这两个依赖也只在 Windows 下引入，
# 免得给 Linux/macOS 构建平白多编两个 crate。
png = "0.18"
base64 = "0.22"

[lints]
workspace = true
