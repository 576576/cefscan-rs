<!doctype html>
<!-- 经典模式（喜报背景 + 结果缓缓浮现）默认开启，所以主题类直接写在 html 上，
     免得脚本跑起来之前先闪一下深色。 -->
<html lang="zh-CN" class="classic">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cefscanw</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <div class="brand">cefscanw</div>
        <input
          id="root-input"
          type="text"
          placeholder="限定目录（留空扫描全部盘符）"
          spellcheck="false"
        />
        <!-- 后端不提供选择：自动挑选总是更优（有 Everything 就用，没有就自己遍历）。
             但"自动"两个字本身没有信息量，所以括号里实时显示它到底选了谁。 -->
        <span id="backend-display" title="自动挑选搜索后端，括号内是本次实际使用的后端"
          >自动（待扫描）</span
        >
        <label class="toggle" title="换成喜报背景，并让结果一条条缓缓浮现">
          <input id="classic-input" type="checkbox" checked />
          <span>经典模式</span>
        </label>
        <button id="scan-button" type="button">开始扫描</button>
        <span id="status" class="status">就绪</span>
      </header>

      <section class="summary" id="summary" hidden>
        <div><span class="label">应用</span><span id="sum-apps">0</span></div>
        <div><span class="label">总占用</span><span id="sum-total">0 B</span></div>
        <div><span class="label">列表合计</span><span id="sum-sum">0 B</span></div>
        <div><span class="label">后端</span><span id="sum-backend">-</span></div>
        <div><span class="label">耗时</span><span id="sum-elapsed">0 ms</span></div>
      </section>

      <main class="table-wrap">
        <table id="results">
          <colgroup>
            <col class="col-icon" />
            <col class="col-name" />
            <col class="col-kind" />
            <col class="col-size" />
            <col class="col-running" />
            <col class="col-path" />
          </colgroup>
          <thead>
            <tr>
              <th class="icon-col" aria-label="图标"></th>
              <th data-sort="name">名称</th>
              <th data-sort="kind">类型</th>
              <th data-sort="size">占用</th>
              <th data-sort="running">运行</th>
              <th data-sort="path">路径</th>
            </tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
        <p id="empty" class="empty">点上面的按钮开始扫描。</p>
      </main>
    </div>

    <script src="main.js"></script>
  </body>
</html>
