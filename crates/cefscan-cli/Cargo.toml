[package]
name = "cefscan-cli"
description = "Command-line scanner that finds CEF / Electron / NWJS applications"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "cefscan"
path = "src/main.rs"

[features]
default = ["everything"]
everything = ["cefscan-core/everything"]

[dependencies]
cefscan-core = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
csv = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
