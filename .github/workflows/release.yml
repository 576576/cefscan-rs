name: Release

# 发布唯一入口：推送 main 出自动 alpha，手动 dispatch 出 alpha / beta / release。质量门禁挂在链路上（调 lint.yml），构建复用 build.yml，最后 publish 建 Release。
on:
  push:
    branches: [main]
    # 纯文档改动不出包；只要改动里还有一个非文档文件就照跑（paths-ignore 只在"全部命中"时才跳过）。
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      channel:
        description: 发布通道
        type: choice
        options: [alpha, beta, release]
        default: alpha
      release_notes:
        description: 发行说明（留空则用 GitHub 自动生成）
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  prep:
    name: 准备发布参数
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.out.outputs.channel }}
      version: ${{ steps.out.outputs.version }}
      tag: ${{ steps.out.outputs.tag }}
      prerelease: ${{ steps.out.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 版本号要数提交数，必须拿全历史（默认的浅克隆只有 1 条）。
          fetch-depth: 0
      # 版本号 = 提交数推导的三段式 0.{count/100}.{count%100 补零两位}，不额外偏移；alpha/beta 的 tag 带 run_id 保证唯一，release 用纯版本号。
      - name: 推导版本与 tag
        id: out
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ github.event.inputs.channel }}"
          else
            CHANNEL="alpha"
          fi
          case "$CHANNEL" in
            alpha|beta|release) ;;
            *) echo "::error::未知通道 $CHANNEL"; exit 1 ;;
          esac
          COUNT="$(git rev-list --count HEAD)"
          VERSION="0.$((COUNT / 100)).$(printf '%02d' $((COUNT % 100)))"
          case "$CHANNEL" in
            release) TAG="v${VERSION}"; PRE="false" ;;
            beta)    TAG="v${VERSION}-beta.${{ github.run_id }}"; PRE="false" ;;
            alpha)   TAG="v${VERSION}-alpha.${{ github.run_id }}"; PRE="true" ;;
          esac
          {
            echo "channel=$CHANNEL"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "prerelease=$PRE"
          } >> "$GITHUB_OUTPUT"
          echo "通道=$CHANNEL 版本=$VERSION tag=$TAG"

  lint:
    name: 质量门禁（复用 lint.yml）
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  build:
    name: 构建（复用 build.yml）
    needs: [prep, lint]
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prep.outputs.version }}
      channel: ${{ needs.prep.outputs.channel }}

  publish:
    name: 发布 ${{ needs.prep.outputs.channel }}（${{ needs.prep.outputs.version }}）
    needs: [prep, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: 收到的产物
        run: ls -la artifacts
      # release 通道同版本重复发布时先删旧 tag/release；alpha/beta 的 tag 带 run_id，天然唯一不删。
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prep.outputs.tag }}
          VERSION: ${{ needs.prep.outputs.version }}
          CHANNEL: ${{ needs.prep.outputs.channel }}
          PRE: ${{ needs.prep.outputs.prerelease }}
          NOTES: ${{ github.event.inputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = "release" ] && gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag || true
          fi
          FILES=(artifacts/*.zip)
          [ -e "${FILES[0]}" ] || { echo "::error::没有收到任何产物"; exit 1; }
          PRE_FLAG=()
          [ "$PRE" = "true" ] && PRE_FLAG=(--prerelease)
          if [ -n "${NOTES:-}" ]; then
            gh release create "$TAG" "${FILES[@]}" --title "cefscan $VERSION（$CHANNEL）" --notes "$NOTES" "${PRE_FLAG[@]}"
          else
            gh release create "$TAG" "${FILES[@]}" --title "cefscan $VERSION（$CHANNEL）" --generate-notes "${PRE_FLAG[@]}"
          fi
