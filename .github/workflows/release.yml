name: Release

# 发布唯一入口：推送 main 出自动 alpha，手动 dispatch 出 alpha / beta / release。质量门禁挂在链路上（调 lint.yml），构建复用 build.yml，最后 publish 建 Release。
on:
  push:
    branches: [main]
    # 纯文档改动不出包；只要改动里还有一个非文档文件就照跑（paths-ignore 只在"全部命中"时才跳过）。
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      channel:
        description: 发布通道
        type: choice
        options: [alpha, beta, release]
        default: alpha
      # Windows 工具链：msvc 走 VS 生成工具，gnullvm 走 llvm-mingw（产物名多一段 -gnullvm）；all 是两套都出。
      windows_toolchain:
        description: Windows 工具链
        type: choice
        options: [msvc, gnullvm, all]
        default: msvc
      # 架构开关：先 Windows 再 Linux，同族内一律 x64 在前、arm64 在后。
      build_windows_x64:
        description: Windows x64
        type: boolean
        default: true
      build_windows_arm64:
        description: Windows arm64
        type: boolean
        default: false
      build_linux_x64:
        description: Linux x64
        type: boolean
        default: true
      build_linux_arm64:
        description: Linux arm64
        type: boolean
        default: false
      release_notes:
        description: 发行说明
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  prep:
    name: 准备发布参数
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.out.outputs.channel }}
      version: ${{ steps.out.outputs.version }}
      tag: ${{ steps.out.outputs.tag }}
      prerelease: ${{ steps.out.outputs.prerelease }}
      targets: ${{ steps.out.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 版本号要数提交数，必须拿全历史（默认的浅克隆只有 1 条）。
          fetch-depth: 0
      - name: 推导版本与构建矩阵
        id: out
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ github.event.inputs.channel }}"
            WIN_TC="${{ github.event.inputs.windows_toolchain }}"
            SEL=""
            [ "${{ github.event.inputs.build_windows_x64 }}" = "true" ] && SEL="$SEL windows-x86_64"
            [ "${{ github.event.inputs.build_windows_arm64 }}" = "true" ] && SEL="$SEL windows-arm64"
            [ "${{ github.event.inputs.build_linux_x64 }}" = "true" ] && SEL="$SEL linux-x86_64"
            [ "${{ github.event.inputs.build_linux_arm64 }}" = "true" ] && SEL="$SEL linux-arm64"
            # 输入缺失时渲染成空串（不是 "false"），统一兜底。
            WIN_TC="${WIN_TC:-msvc}"
          else
            # 推送 main：自动 alpha，固定 windows-x86_64 + linux-x86_64，与手动 dispatch 的默认值一致。
            CHANNEL="alpha"
            WIN_TC="msvc"
            SEL="windows-x86_64 linux-x86_64"
          fi
          case "$CHANNEL" in
            alpha|beta|release) ;;
            *) echo "::error::未知通道 $CHANNEL"; exit 1 ;;
          esac
          # 拼错的工具链会造出不存在的 rust target，每个 target 白跑一遍编译才报错，这里先拦下来。
          case "$WIN_TC" in
            msvc|gnullvm|all) ;;
            *) echo "::error::未知的 Windows 工具链：$WIN_TC"; exit 1 ;;
          esac
          [ -n "$SEL" ] || { echo "::error::未选择任何构建目标"; exit 1; }
          INCLUDE="$(python3 - "$SEL" "$WIN_TC" <<'PY'
          import json, sys

          sel = sys.argv[1].split()
          toolchain = sys.argv[2]
          # Windows 的产物名 / 附件名都从 target 派生，所以工具链这一维只加在这里。
          WINDOWS = {
              "windows-x86_64": ("windows-latest", "x86_64-pc-windows-"),
              "windows-arm64": ("windows-11-arm", "aarch64-pc-windows-"),
          }
          OTHER = {
              "linux-x86_64": ("ubuntu-latest", "x86_64-unknown-linux-gnu"),
              "linux-arm64": ("ubuntu-24.04-arm", "aarch64-unknown-linux-gnu"),
          }
          # all 是两套都出；顺序与「单独跑两次」一致（msvc 在前）。
          chains = ("msvc", "gnullvm") if toolchain == "all" else (toolchain,)
          include = []
          for target in sel:
              if target in WINDOWS:
                  os_name, prefix = WINDOWS[target]
                  for chain in chains:
                      name = target if chain == "msvc" else f"{target}-{chain}"
                      include.append({"target": name, "os": os_name,
                                      "rust_target": f"{prefix}{chain}", "exe": ".exe"})
              elif target in OTHER:
                  os_name, rust_target = OTHER[target]
                  include.append({"target": target, "os": os_name,
                                  "rust_target": rust_target, "exe": ""})
          print(json.dumps(include))
          PY
          )"
          # 版本号 = 提交数推导的三段式 0.{count/100}.{count%100 补零两位}，不额外偏移；alpha/beta 的 tag 带 run_id 保证唯一，release 用纯版本号。
          COUNT="$(git rev-list --count HEAD)"
          VERSION="0.$((COUNT / 100)).$(printf '%02d' $((COUNT % 100)))"
          case "$CHANNEL" in
            release) TAG="v${VERSION}"; PRE="false" ;;
            beta)    TAG="v${VERSION}-beta.${{ github.run_id }}"; PRE="false" ;;
            alpha)   TAG="v${VERSION}-alpha.${{ github.run_id }}"; PRE="true" ;;
          esac
          {
            echo "channel=$CHANNEL"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "prerelease=$PRE"
            echo "targets=$INCLUDE"
          } >> "$GITHUB_OUTPUT"
          echo "通道=$CHANNEL 版本=$VERSION tag=$TAG"
          echo "  目标：$SEL（Windows 工具链 $WIN_TC）"

  lint:
    name: 质量门禁（复用 lint.yml）
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  build:
    name: 构建（复用 build.yml）
    needs: [prep, lint]
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prep.outputs.version }}
      channel: ${{ needs.prep.outputs.channel }}
      targets: ${{ needs.prep.outputs.targets }}

  publish:
    name: 发布 ${{ needs.prep.outputs.channel }}（${{ needs.prep.outputs.version }}）
    needs: [prep, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: 收到的产物
        run: ls -la artifacts
      # release 通道同版本重复发布时先删旧 tag/release；alpha/beta 的 tag 带 run_id，天然唯一不删。
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prep.outputs.tag }}
          VERSION: ${{ needs.prep.outputs.version }}
          CHANNEL: ${{ needs.prep.outputs.channel }}
          PRE: ${{ needs.prep.outputs.prerelease }}
          NOTES: ${{ github.event.inputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = "release" ] && gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag || true
          fi
          FILES=(artifacts/*.zip)
          [ -e "${FILES[0]}" ] || { echo "::error::没有收到任何产物"; exit 1; }
          # 架构矩阵按实际收到的附件渲染，所以 dispatch 少勾一个架构时表里就没有那一行。
          REL_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          ROWS=""
          HAS_GNULLVM=""
          # 固定次序：平台 Windows → Linux，架构 x64 → arm64，工具链 MSVC → gnullvm。
          for T in windows-x86_64 windows-x86_64-gnullvm windows-arm64 windows-arm64-gnullvm linux-x86_64 linux-arm64; do
            N="cefscan-${VERSION}-${T}.zip"
            [ -f "artifacts/$N" ] || continue
            case "$T" in windows-*) OS="Windows" ;; *) OS="Linux" ;; esac
            case "$T" in *-x86_64*) ARCH="x86_64" ;; *) ARCH="arm64" ;; esac
            # 工具链只有 Windows 有这一维（Linux 是单一的 -gnu 目标），非 Windows 填破折号。
            case "$T" in
              *-gnullvm) TC="gnullvm"; HAS_GNULLVM=1 ;;
              windows-*) TC="MSVC" ;;
              *)         TC="—" ;;
            esac
            ROWS="${ROWS}| ${OS} | ${ARCH} | ${TC} | [\`${N}\`](${REL_URL}/${N}) |"$'\n'
          done
          BODY="| 平台 | 架构 | 工具链 | 下载 |
          |:--|:--|:--|:--|
          ${ROWS}"
          # gnullvm 那份动态链 WebView2Loader.dll（MSVC 那份静态链），说一句免得以为包里多了个文件。
          if [ -n "$HAS_GNULLVM" ]; then
            BODY="${BODY}
          > gnullvm 版本额外附带 \`WebView2Loader.dll\`；MSVC 版本已静态链接，不需要它。"
          fi
          # 手填的发行说明排在最前，changelog 由 --generate-notes 追加在最后（不是取代）。
          NOTES="${NOTES//$'\r'/}"
          if [ -n "$NOTES" ]; then
            BODY="$(printf '%b' "$NOTES")"$'\n\n'"$BODY"
          fi
          PRE_FLAG=()
          if [ "$PRE" = "true" ]; then PRE_FLAG=(--prerelease); fi
          gh release create "$TAG" "${FILES[@]}" \
            --title "cefscan $VERSION（$CHANNEL）" \
            --notes "$BODY" \
            --generate-notes \
            "${PRE_FLAG[@]}"
