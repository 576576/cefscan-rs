[workspace]
resolver = "2"
members = [
    "crates/cefscan-core",
    "crates/cefscan-cli",
    "crates/cefscan-desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["cefscan contributors"]
rust-version = "1.92.0"

[workspace.dependencies]
cefscan-core = { path = "crates/cefscan-core" }

rayon = "1.10"
memchr = "2.7"
thiserror = "2"
anyhow = "1"
clap = { version = "4", default-features = false, features = [
    "derive",
    "std",
    "help",
    "usage",
    "error-context",
    "wrap_help",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
toml = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

# CI 专用 profile：测试用，依赖不优化、不带 debuginfo。
[profile.ci]
inherits = "dev"
debug = 0

[profile.ci.package."*"]
opt-level = 0
